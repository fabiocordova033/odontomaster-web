<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Clínica dental en Lima especializada en limpieza, ortodoncia y blanqueamiento dental"
    />
    <title>Odontomaster</title>
    <link rel="stylesheet" href="css/servicios.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="logo.png" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">ODONTOMASTER</div>
      <nav id="nav-menu">
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="team.html">Nosotros</a>
        <a href="#">Contacto</a>
      </nav>
      <a href="https://wa.me/51910840567" target="_blank" class="btn-whatsapp">
        <span class="icon">
          <img src="imagenes/whatsapp.png" alt="whatsapp" />
        </span>
        Whatsapp
      </a>
      <div class="menu-toggle" id="menu-toggle">☰</div>
    </header>
    <!-- TRATAMIENTOS DENTALES -->
    <!-- SECCIÓN TRATAMIENTOS CIRCULARES -->
    <section class="tratamientos-circulares">
      <div class="tc-container">
        <h2>Tratamientos Dentales<br /><span>Integrales</span></h2>
        <p class="tc-subtitle">
          Todos nuestros tratamientos y servicios se brindan en cómodas
          instalaciones con los más altos estándares de calidad.
        </p>

        <div class="tc-circle-wrapper">
          <!-- Círculo principal -->
          <div class="tc-circle">
            <!-- Imagen central -->
            <div class="tc-center">
              <img
                src="imagenes/paciente-sonriente.jpg"
                alt="Paciente sonriendo"
              />
            </div>

            <!-- ITEMS alrededor (10) -->
            <button class="tc-item" data-angle="0">
              Resinas De Alta Estética
            </button>
            <button class="tc-item" data-angle="36">Prótesis Bucales</button>
            <button class="tc-item" data-angle="72">Periodoncia</button>
            <button class="tc-item" data-angle="108">Ortodoncia</button>
            <button class="tc-item" data-angle="144">Odontopediatría</button>
            <button class="tc-item" data-angle="180">Implantología</button>
            <button class="tc-item" data-angle="216">Endodoncia</button>
            <button class="tc-item" data-angle="252">
              Cirugía Maxilofacial
            </button>
            <button class="tc-item" data-angle="288">Carillas Dentales</button>
            <button class="tc-item" data-angle="324">
              Blanqueamiento Dental
            </button>
          </div>
        </div>
        <!-- Descripción dinámica (opcional) -->
        <p id="tc-descripcion" class="tc-descripcion">
          Selecciona un tratamiento para ver más detalles.
        </p>
      </div>
    </section>

    <!-- CASOS CLINICOS -->
    <section class="clinical-cases">
      <h2>Casos Clínicos</h2>

      <!-- SELECT -->
      <select id="categorySelect">
        <option value="">Selecciona una opción</option>

        <option value="Ortodoncia infantil">Ortodoncia Infantil</option>

        <option value="Endodoncia">Endodoncia</option>

        <option value="Ortodoncia en lingual">Ortodoncia en lingual</option>
      </select>

      <!-- GRID DE IMAGENES -->
      <div class="cases-grid" id="casesGrid">
        <!-- LAS IMAGENES SE INSERTARAN DESDE JS -->
      </div>
    </section>
    <script src="scripts/servicios.js"></script>
  </body>
</html>
